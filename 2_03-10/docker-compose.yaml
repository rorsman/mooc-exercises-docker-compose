services:
  redis:
    image: redis
  db:
    image: postgres:18
    environment:
      - POSTGRES_PASSWORD=mysecretpassword
    volumes:
      - ./database:/var/lib/postgresql
  backend:
    image: alror/mooc-backend
    environment:
      - REDIS_HOST=redis
      - REQUEST_ORIGIN=http://localhost:8000
      - POSTGRES_HOST=db
      - POSTGRES_PASSWORD=mysecretpassword
    depends_on:
      - redis
      - db
  frontend:
    image: alror/mooc-frontend
  nginx:
    image: nginx
    ports:
      - 8000:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend
 